name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual run from the Actions tab, e.g. to rebuild main without a new commit.
  workflow_dispatch:

permissions:
  contents: read

# One run per ref; a new push cancels the previous run instead of queueing a
# second one for the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      - name: Tests
        run: cargo test --workspace --locked

  # Compiles the shipping profile. Clippy and the tests above only cover the
  # dev profile, so a release-only breakage (codegen, link, feature wiring in
  # dependency builds) would otherwise reach a user before CI saw it.
  build:
    name: Build (release)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      # Dependency install step: pulls exactly the versions in Cargo.lock and
      # fails on a stale lockfile instead of resolving new ones.
      - name: Install dependencies
        run: cargo fetch --locked
      # README's build command, widened to the whole workspace so a broken
      # auxiliary crate (xtask) fails here as well.
      - name: Build
        run: cargo build --workspace --release --locked
      # target/ disappears with the runner, so the binary only outlives the run
      # once it is attached to it. if-no-files-found turns a renamed or moved
      # binary into a red job instead of a silently empty artifact.
      - name: Upload binary
        uses: actions/upload-artifact@v7
        with:
          name: victory-release
          path: target/release/victory.exe
          if-no-files-found: error
          retention-days: 14
      # Nothing extra is compiled for this: the release profile keeps line
      # tables (debug = "line-tables-only" in Cargo.toml), so the link step
      # already writes the PDB. It ships as its own artifact because only crash
      # triage needs it, and it must come from the same run as the exe it
      # explains - a PDB from another run will not match.
      - name: Upload symbols
        uses: actions/upload-artifact@v7
        with:
          name: victory-release-symbols
          path: target/release/victory.pdb
          if-no-files-found: error
          retention-days: 14
